<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YouTube to Commons</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; line-height: 1.6; }
        .box { border: 1px solid #ccc; padding: 20px; border-radius: 8px; background: #f9f9f9; }
        input[type="text"] { width: calc(100% - 130px); padding: 10px; margin-bottom: 15px; }
        button { padding: 10px; background: #3366cc; color: white; border: none; cursor: pointer; border-radius: 4px; margin: 5px;}
        button:hover { background: #2b56a8; }
        #controls, #player-container, #status { display: none; margin-top: 20px; }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
        iframe { width: 100%; height: 390px; border: none; }
    </style>
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
    <h1>YouTube to Wikimedia Commons</h1>
    
    <div class="box">
        {% if not logged_in %}
            <p>Please log in to continue.</p>
            <form action="/login" method="get">
                <button type="submit">Log in with Wikimedia</button>
            </form>
        {% else %}
            <div>
                <label>YouTube URL:</label><br>
                <input type="text" id="yt_url" placeholder="https://www.youtube.com/watch?v=...">
                <button onclick="checkLicense()">Check License</button>
            </div>
            
            <div id="status"></div>

            <div id="controls">
                <button onclick="sendMedia('audio')">Send Audio (Ogg)</button>
                <button onclick="sendMedia('video')">Send Video (WebM)</button>
                <button onclick="sendMedia('thumbnail')">Send Thumbnail</button>
                <button onclick="showPlayer()">Send Frame of Video</button>
            </div>

            <div id="player-container">
                <div id="player"></div>
                <button onclick="sendFrame()" style="width: 100%; background: #28a745; margin-top: 10px; padding: 15px; font-size: 16px;">
                    Send Frame (Capture current moment)
                </button>
            </div>
            
            <br>
            <a href="/logout" style="color: red;">Log out</a>
        {% endif %}
    </div>

    <script>
        let ytPlayer;
        let currentVideoId = "";

        function onYouTubeIframeAPIReady() {
            console.log("YouTube API ready.");
        }

        async function checkLicense() {
            const url = document.getElementById('yt_url').value;
            const statusDiv = document.getElementById('status');
            const controlsDiv = document.getElementById('controls');
            const playerContainer = document.getElementById('player-container');
            
            statusDiv.style.display = 'block';
            controlsDiv.style.display = 'none';
            playerContainer.style.display = 'none';
            statusDiv.innerHTML = 'Checking license...';
            statusDiv.className = '';

            try {
                const response = await fetch('/check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });
                const data = await response.json();

                if (data.is_cc) {
                    statusDiv.innerHTML = '✔ License verified (Creative Commons). You can now upload files.';
                    statusDiv.className = 'success';
                    controlsDiv.style.display = 'block';
                    currentVideoId = data.id;
                } else {
                    statusDiv.innerHTML = '✖ Error: ' + data.error;
                    statusDiv.className = 'error';
                }
            } catch (err) {
                statusDiv.innerHTML = '✖ Server communication error.';
                statusDiv.className = 'error';
            }
        }

        function showPlayer() {
            document.getElementById('player-container').style.display = 'block';
            if (!ytPlayer) {
                ytPlayer = new YT.Player('player', {
                    height: '390',
                    width: '100%',
                    videoId: currentVideoId,
                });
            } else {
                ytPlayer.loadVideoById(currentVideoId);
            }
        }

        async function sendMedia(type) {
            const url = document.getElementById('yt_url').value;
            if(!confirm(`Are you sure you want to send this ${type}? Please note that the file will be flagged for review by a Commons administrator.`)) {
                return;
            }
            uploadToServer(url, type);
        }

        async function sendFrame() {
            if (!ytPlayer) return;
            const timestamp = ytPlayer.getCurrentTime();
            const url = document.getElementById('yt_url').value;
            
            if(!confirm(`Are you sure you want to send it?\n\nA frame from second ${Math.round(timestamp)} of the video will be extracted. The file will be flagged for review.`)) {
                return;
            }
            uploadToServer(url, 'frame', timestamp);
        }

        async function uploadToServer(url, type, timestamp = null) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = 'Processing and uploading to Commons... This may take a few minutes.';
            statusDiv.className = '';

            const formData = new FormData();
            formData.append('url', url);
            formData.append('type', type);
            if (timestamp) formData.append('timestamp', timestamp);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.success) {
                    statusDiv.innerHTML = `✔ Success! File published: <a href="${data.url}" target="_blank">View on Commons</a>`;
                    statusDiv.className = 'success';
                } else {
                    statusDiv.innerHTML = '✖ Upload error: ' + data.error;
                    statusDiv.className = 'error';
                }
            } catch (err) {
                statusDiv.innerHTML = '✖ Error during file upload.';
                statusDiv.className = 'error';
            }
        }
    </script>
</body>
</html>
